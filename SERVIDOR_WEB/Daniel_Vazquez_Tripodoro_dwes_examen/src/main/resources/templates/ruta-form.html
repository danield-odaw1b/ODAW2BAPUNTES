<!DOCTYPE html>
<!--
    Formulario de partida: solo HTML, sin atributos de Thymeleaf.
    Tu trabajo es convertirlo en la plantilla que sirve tanto para el alta como para la edición.
    Los nombres de los controles (nombre y km) son los atributos de la clase Ruta.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruta</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<main>
    <h1>Ruta</h1>


    <form th:method="post"
         th:action="${id == null} ? @{/rutas/nueva} : @{/rutas/{id}/editar(id = ${id})}">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" th:value="${nombre}">

        <label for="km">Kilómetros</label>
        <input type="number" id="km" name="km" th:value="${km}">

        <button type="submit">Guardar</button>
        <a th:href="@{/rutas}">Cancelar</a>
    </form>
    <div th:if="${error != null}">
        <p th:text="${error}"></p>
    </div>
</main>
</body>
</html>
